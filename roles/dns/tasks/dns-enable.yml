---
- name: Place systemd service unit file
  ansible.builtin.template:
    src: templates/systemd.j2
    dest: /etc/systemd/system/docker-dns.service
    mode: "0644"
  become: true

- name: Enable and start the service unit
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: docker-dns
    enabled: true
    masked: false
    state: started
  become: true
