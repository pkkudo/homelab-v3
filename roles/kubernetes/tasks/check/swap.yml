---
- name: Identify swap unit
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      systemctl show --type swap --state=active --no-pager | awk -F= '/^Names/ {print $2}' | sed 's/\"//g'
    executable: /bin/bash
  when:
    - ansible_swaptotal_mb | int > 0
  register: result_swap
  changed_when: false

- name: Set fact when swap is disabled
  ansible.builtin.set_fact:
    swap_unit_name: "none"
  when: result_swap is skipped

- name: Set fact when swap is enabled
  ansible.builtin.set_fact:
    swap_unit_name: "{{ result_swap.stdout }}"
  when:
    - swap_unit_name is undefined
    - result_swap is succeeded
