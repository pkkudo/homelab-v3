---
- name: Download files on ansible master
  run_once: true
  delegate_to: localhost
  block:
    - name: Ensure cni directory exists on ansible master
      ansible.builtin.file:
        path: files/cni
        state: directory
        mode: "0755"

    - name: Download cni
      ansible.builtin.get_url:
        url: "{{ url_cni }}"
        dest: "files/cni/cni-{{ ver_cni }}-amd64.tgz"
        checksum: "sha256:{{ checksum_cni }}"
        mode: "0644"

- name: Upload cni
  become: true
  block:
    - name: Reset tmp cni directory
      ansible.builtin.file:
        path: /tmp/cni
        state: absent

    - name: Ensure tmp cni directory exists
      ansible.builtin.file:
        path: /tmp/cni
        state: directory
        mode: "0755"

    - name: Upload cni file
      ansible.builtin.copy:
        src: "files/cni/cni-{{ ver_cni }}-amd64.tgz"
        dest: /tmp/cni/cni.tgz
        mode: "0644"

- name: Install cni
  become: true
  block:
    - name: Ensure /opt/cni/bin directory exists
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    - name: Extract CNI plugins
      # mkdir -p /opt/cni/bin
      # tar Cxzvf /opt/cni/bin cni-plugins-linux-amd64-v1.1.1.tgz
      # ansible.builtin.command: tar Cxzvf /opt/cni/bin /tmp/cni/cni.tgz
      ansible.builtin.unarchive:
        src: /tmp/cni/cni.tgz
        dest: /opt/cni/bin
        remote_src: true
